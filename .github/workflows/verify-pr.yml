name: Verify Documentation PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Broken Links Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Docusaurus (Verify No Broken Links)
        env:
          DOCUSAURUS_URL: https://goroute-ai.github.io
          DOCUSAURUS_BASE_URL: /
        run: npm run build
